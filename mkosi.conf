# The images of hub.nspawn.org: one OCI image per distribution, built by mkosi and pushed
# to the hub by CI (see .github/workflows/mkosi.yml). Pick a distribution with
#
#   mkosi -d fedora -r 44
#
# or write it to mkosi.local.conf. The result is an OCI layout under mkosi.output/, what
# nspawn pull expects: a systemd machine (Cmd is /sbin/init), no kernel, no initrd. The
# `disk` profile builds a bootable disk image of the same content instead.

[Config]
MinimumVersion=27

[Build]
# The tools tree provides the package managers of every distribution; Fedora's carries
# them all. Pinned to a release so that local and CI builds use the same one.
ToolsTree=default
ToolsTreeDistribution=fedora
ToolsTreeRelease=44
History=yes
CacheDirectory=mkosi.cache
Incremental=yes

[Output]
Format=oci
CompressOutput=zstd
OutputDirectory=mkosi.output
ImageId=%d
ManifestFormat=json
Output=%i_%v_%a
OciAnnotations=org.opencontainers.image.source=https://github.com/nspawn/mkosi-definitions
               org.opencontainers.image.url=https://nspawn.org/
               org.opencontainers.image.vendor=nspawn.org
OciLabels=org.opencontainers.image.source=https://github.com/nspawn/mkosi-definitions

[Content]
Bootable=no
# Container images carry no kernel: do not build the default initrd sub-image.
Initrds=
Hostname=%d-%r
RootPassword=root

[Validation]
Checksum=no
Sign=no
