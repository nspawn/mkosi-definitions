# Build every image of the matrix with mkosi and, on master, push it to hub.nspawn.org.
# Pull requests only build. The weekly run picks up package updates.
name: mkosi

on:
  push:
    branches: [master]
    paths:
      - mkosi.conf
      - mkosi.conf.d/**
      - mkosi.profiles/**
      - mkosi.repart/**
      - mkosi.bump
      - .github/workflows/mkosi.yml
  pull_request:
    paths:
      - mkosi.conf
      - mkosi.conf.d/**
      - mkosi.profiles/**
      - mkosi.repart/**
      - mkosi.bump
      - .github/workflows/mkosi.yml
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    name: ${{ matrix.repo }}:${{ matrix.release }}
    runs-on: ubuntu-24.04
    concurrency:
      group: ${{ github.workflow }}-${{ matrix.repo }}-${{ matrix.release }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # distro and release are what mkosi takes; repo and tags are what the hub shows.
          # The first tag is the canonical one and also gets a dated variant (44-20260922).
          - { distro: arch,     release: rolling,      repo: archlinux,  tags: rolling latest }
          - { distro: debian,   release: trixie,       repo: debian,     tags: 13 trixie latest }
          - { distro: debian,   release: bookworm,     repo: debian,     tags: 12 bookworm }
          - { distro: debian,   release: sid,          repo: debian,     tags: sid unstable }
          - { distro: ubuntu,   release: resolute,     repo: ubuntu,     tags: 26.04 resolute latest }
          - { distro: ubuntu,   release: noble,        repo: ubuntu,     tags: 24.04 noble }
          - { distro: ubuntu,   release: jammy,        repo: ubuntu,     tags: 22.04 jammy }
          - { distro: fedora,   release: "44",         repo: fedora,     tags: 44 latest }
          - { distro: fedora,   release: "43",         repo: fedora,     tags: "43" }
          - { distro: fedora,   release: rawhide,      repo: fedora,     tags: rawhide }
          - { distro: centos,   release: "10",         repo: centos,     tags: 10 latest }
          - { distro: centos,   release: "9",          repo: centos,     tags: "9" }
          - { distro: alma,     release: "10",         repo: almalinux,  tags: 10 latest }
          - { distro: alma,     release: "9",          repo: almalinux,  tags: "9" }
          - { distro: rocky,    release: "10",         repo: rockylinux, tags: 10 latest }
          - { distro: rocky,    release: "9",          repo: rockylinux, tags: "9" }
          - { distro: opensuse, release: tumbleweed,   repo: opensuse,   tags: tumbleweed latest }
          - { distro: opensuse, release: "16.0",       repo: opensuse,   tags: 16.0 leap }
          - { distro: kali,     release: kali-rolling, repo: kali,       tags: rolling latest }
          # Services: a profile on the Debian image, tagged with the version of the package
          # named in versionof (read from mkosi's manifest): 1.26.3, 1.26 and latest.
          - { distro: debian, release: trixie, profile: nginx,      repo: nginx,      versionof: nginx }
          - { distro: debian, release: trixie, profile: apache,     repo: apache,     versionof: apache2 }
          - { distro: debian, release: trixie, profile: caddy,      repo: caddy,      versionof: caddy }
          - { distro: debian, release: trixie, profile: postgresql, repo: postgresql, versionof: postgresql-17 }
          - { distro: debian, release: trixie, profile: mariadb,    repo: mariadb,    versionof: mariadb-server }
          - { distro: debian, release: trixie, profile: valkey,     repo: valkey,     versionof: valkey-server }
          - { distro: debian, release: trixie, profile: memcached,  repo: memcached,  versionof: memcached }
          - { distro: debian, release: trixie, profile: rabbitmq,   repo: rabbitmq,   versionof: rabbitmq-server }
          - { distro: debian, release: trixie, profile: mosquitto,  repo: mosquitto,  versionof: mosquitto }
          - { distro: debian, release: trixie, profile: haproxy,    repo: haproxy,    versionof: haproxy }
          - { distro: debian, release: trixie, profile: unbound,    repo: unbound,    versionof: unbound }
          - { distro: debian, release: trixie, profile: dnsmasq,    repo: dnsmasq,    versionof: dnsmasq }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: systemd/mkosi@4736cd836108a97772142c461c49f1ddb4172348 # v27

      - name: Configure
        run: |
          echo "IMAGE_VERSION=$(./mkosi.bump)" >> "$GITHUB_ENV"
          tee mkosi.local.conf <<EOF
          [Distribution]
          Distribution=${{ matrix.distro }}
          Release=${{ matrix.release }}
          EOF
          if [ -n "${{ matrix.profile }}" ]; then
            printf '\n[Config]\nProfiles=%s\n' "${{ matrix.profile }}" | tee -a mkosi.local.conf
          fi

      - name: Summary
        run: mkosi --image-version="$IMAGE_VERSION" summary

      - name: Build
        run: sudo mkosi --image-version="$IMAGE_VERSION" -f build

      - name: Inspect the OCI layout
        run: |
          sudo chown -R "$(id -u):$(id -g)" mkosi.output
          # Named after the image id, which is the repository on the hub.
          layout=$(find mkosi.output -maxdepth 1 -type d -name '${{ matrix.repo }}_*' | head -n1)
          test -f "$layout/oci-layout"
          echo "LAYOUT=$layout" >> "$GITHUB_ENV"
          sudo apt-get install -y -q --no-install-recommends skopeo >/dev/null
          skopeo inspect "oci:$layout" | head -n 40
          du -sh "$layout"

      - name: Tags
        run: |
          if [ -n "${{ matrix.versionof }}" ]; then
            version=$(python3 - "$LAYOUT.manifest" '${{ matrix.versionof }}' <<'EOF'
          import json, re, sys
          packages = json.load(open(sys.argv[1]))["packages"]
          version = next(p["version"] for p in packages if p["name"] == sys.argv[2])
          version = version.split(":", 1)[-1]         # no epoch
          version = version.split("-", 1)[0]          # no Debian revision
          print(re.split(r"[+~]", version)[0])        # no +dfsg or ~rc suffix
          EOF
            )
            tags="$version ${version%.*} latest"
          else
            tags="${{ matrix.tags }}"
          fi
          echo "TAGS=$tags" >> "$GITHUB_ENV"
          echo "tags: $tags"

      - name: Keep the package manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.repo }}-${{ matrix.release }}-manifest
          path: mkosi.output/*.manifest
          if-no-files-found: warn

      - name: Push to the hub
        if: github.event_name != 'pull_request'
        env:
          HUB_USER: ${{ secrets.HUB_USER }}
          HUB_PASSWORD: ${{ secrets.HUB_PASSWORD }}
        run: |
          printf '%s' "$HUB_PASSWORD" | skopeo login hub.nspawn.org -u "$HUB_USER" --password-stdin
          push() {
            # A registry restart or a hiccup mid-upload is not worth a rebuild: try again.
            for attempt in 1 2 3 4 5; do
              skopeo copy --retry-times 3 "oci:$LAYOUT" "docker://hub.nspawn.org/${{ matrix.repo }}:$1" && return 0
              echo "push of $1 failed (attempt $attempt of 5); retrying in 30 seconds"
              sleep 30
            done
            return 1
          }
          set -- $TAGS
          for tag in "$@"; do
            push "$tag"
          done
          # The dated tag names one build for good: the first of the day, never overwritten.
          dated="$1-$IMAGE_VERSION"
          if skopeo inspect --raw "docker://hub.nspawn.org/${{ matrix.repo }}:$dated" >/dev/null 2>&1; then
            echo "$dated exists already and stays as it is"
          else
            push "$dated"
          fi
          skopeo logout hub.nspawn.org
