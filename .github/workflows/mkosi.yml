# Build every image of the matrix with mkosi and, on master, push it to hub.nspawn.org and
# sign it. Pull requests only build. The weekly run picks up package updates.
name: mkosi

on:
  push:
    branches: [master]
    paths:
      - mkosi.conf
      - mkosi.conf.d/**
      - mkosi.profiles/**
      - mkosi.repart/**
      - mkosi.bump
      - images.json
      - .github/select-images.py
      - .github/workflows/mkosi.yml
  pull_request:
    paths:
      - mkosi.conf
      - mkosi.conf.d/**
      - mkosi.profiles/**
      - mkosi.repart/**
      - mkosi.bump
      - images.json
      - .github/select-images.py
      - .github/workflows/mkosi.yml
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      images:
        description: 'Only these images, as repo:release separated by spaces (empty: all of them)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  # What changed decides what is built: a pull request or a push builds the images its
  # files affect, the weekly run and a manual one build them all (see select-images.py),
  # unless the manual one names the images it wants.
  select:
    runs-on: ubuntu-24.04
    outputs:
      images: ${{ steps.select.outputs.images }}
      count: ${{ steps.select.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: select
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          ONLY: ${{ inputs.images }}
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ] && [ -n "$ONLY" ]; then
            images=$(python3 -c 'import json, os, sys
          only = os.environ["ONLY"].split()
          images = [i for i in json.load(open("images.json")) if i["repo"] + ":" + i["release"] in only]
          missing = set(only) - {i["repo"] + ":" + i["release"] for i in images}
          if missing:
              sys.exit("not in images.json: " + " ".join(sorted(missing)))
          print(json.dumps(images))')
            echo "building the images asked for"
          elif [ "${{ github.event_name }}" = schedule ] || [ "${{ github.event_name }}" = workflow_dispatch ] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            images=$(cat images.json)
            echo "building every image"
          else
            changed=$(git diff --name-only "$BASE" HEAD)
            echo "changed files:"; echo "$changed" | sed 's/^/  /'
            images=$(printf '%s\n' "$changed" | ./.github/select-images.py --base "$BASE")
          fi
          count=$(printf '%s' "$images" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')
          printf '%s\n' "$images" | python3 -c 'import json,sys; [print("  " + i["repo"] + ":" + i["release"]) for i in json.load(sys.stdin)]'
          echo "$count image(s) to build"
          {
            echo "images<<EOF"
            printf '%s\n' "$images"
            echo "EOF"
            echo "count=$count"
          } >> "$GITHUB_OUTPUT"

  image:
    needs: select
    if: needs.select.outputs.count != '0'
    name: ${{ matrix.repo }}:${{ matrix.release }}
    runs-on: ubuntu-24.04
    # id-token: the OIDC token that identifies this workflow to Sigstore, for the signature.
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: ${{ github.workflow }}-${{ matrix.repo }}-${{ matrix.release }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.images) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: systemd/mkosi@4736cd836108a97772142c461c49f1ddb4172348 # v27

      - if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Configure
        run: |
          echo "IMAGE_VERSION=$(./mkosi.bump)" >> "$GITHUB_ENV"
          tee mkosi.local.conf <<EOF
          [Distribution]
          Distribution=${{ matrix.distro }}
          Release=${{ matrix.release }}
          EOF
          if [ -n "${{ matrix.profile }}" ]; then
            printf '\n[Config]\nProfiles=%s\n' "${{ matrix.profile }}" | tee -a mkosi.local.conf
          fi

      - name: Summary
        run: mkosi --image-version="$IMAGE_VERSION" summary

      - name: Build
        run: sudo mkosi --image-version="$IMAGE_VERSION" -f build

      - name: Inspect the OCI layout
        run: |
          sudo chown -R "$(id -u):$(id -g)" mkosi.output
          # Named after the image id, which is the repository on the hub.
          layout=$(find mkosi.output -maxdepth 1 -type d -name '${{ matrix.repo }}_*' | head -n1)
          test -f "$layout/oci-layout"
          echo "LAYOUT=$layout" >> "$GITHUB_ENV"
          sudo apt-get install -y -q --no-install-recommends skopeo >/dev/null
          skopeo inspect "oci:$layout" | head -n 40
          du -sh "$layout"

      - name: Tags
        run: |
          if [ -n "${{ matrix.versionof }}" ]; then
            version=$(python3 - "$LAYOUT.manifest" '${{ matrix.versionof }}' <<'EOF'
          import json, re, sys
          packages = json.load(open(sys.argv[1]))["packages"]
          version = next(p["version"] for p in packages if p["name"] == sys.argv[2])
          version = version.split(":", 1)[-1]         # no epoch
          version = version.split("-", 1)[0]          # no Debian revision
          print(re.split(r"[+~]", version)[0])        # no +dfsg or ~rc suffix
          EOF
            )
            tags="$version ${version%.*} latest"
          elif [ -n "${{ matrix.versionfile }}" ]; then
            # A file inside the image, read out of its single layer.
            sudo apt-get install -y -q --no-install-recommends zstd >/dev/null
            layer=$(python3 - "$LAYOUT" <<'EOF'
          import json, sys
          layout = sys.argv[1]
          manifest = json.load(open(layout + "/index.json"))["manifests"][0]["digest"].split(":")[1]
          print(json.load(open(f"{layout}/blobs/sha256/{manifest}"))["layers"][0]["digest"].split(":")[1])
          EOF
            )
            # mkosi stores the members as ./usr/...
            version=$(zstd -dc "$LAYOUT/blobs/sha256/$layer" | tar -xO './${{ matrix.versionfile }}')
            tags="$version ${version%.*} latest"
          else
            tags="${{ matrix.tags }}"
          fi
          echo "TAGS=$tags" >> "$GITHUB_ENV"
          echo "tags: $tags"

      - name: Keep the package manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.repo }}-${{ matrix.release }}-manifest
          path: mkosi.output/*.manifest
          if-no-files-found: warn

      - name: Push to the hub
        if: github.event_name != 'pull_request'
        env:
          HUB_USER: ${{ secrets.HUB_USER }}
          HUB_PASSWORD: ${{ secrets.HUB_PASSWORD }}
        run: |
          printf '%s' "$HUB_PASSWORD" | skopeo login hub.nspawn.org -u "$HUB_USER" --password-stdin
          push() {
            # A registry restart or a hiccup mid-upload is not worth a rebuild: try again.
            for attempt in 1 2 3 4 5; do
              skopeo copy --retry-times 3 "oci:$LAYOUT" "docker://hub.nspawn.org/${{ matrix.repo }}:$1" && return 0
              echo "push of $1 failed (attempt $attempt of 5); retrying in 30 seconds"
              sleep 30
            done
            return 1
          }
          set -- $TAGS
          for tag in "$@"; do
            push "$tag"
          done
          # The dated tag names one build for good: the first of the day, never overwritten.
          dated="$1-$IMAGE_VERSION"
          if skopeo inspect --raw "docker://hub.nspawn.org/${{ matrix.repo }}:$dated" >/dev/null 2>&1; then
            echo "$dated exists already and stays as it is"
          else
            push "$dated"
          fi
          skopeo logout hub.nspawn.org

      # Keyless: no key to keep. GitHub's OIDC token names this workflow on this branch,
      # Fulcio turns that into a short-lived certificate, the signature goes into the Rekor
      # transparency log and, as an OCI referrer, next to the image on the hub (cosign 3's
      # default; the old sha256-<digest>.sig tag would be swept by the hub's tag
      # retention). One signature per digest covers every tag that points to it. cosign
      # reads Docker's credentials file, not the one skopeo login writes.
      - name: Sign
        if: github.event_name != 'pull_request'
        env:
          HUB_USER: ${{ secrets.HUB_USER }}
          HUB_PASSWORD: ${{ secrets.HUB_PASSWORD }}
        run: |
          set -- $TAGS
          digest=$(skopeo inspect --format '{{.Digest}}' "docker://hub.nspawn.org/${{ matrix.repo }}:$1")
          echo "DIGEST=$digest" >> "$GITHUB_ENV"
          printf '%s' "$HUB_PASSWORD" | cosign login hub.nspawn.org -u "$HUB_USER" --password-stdin
          for attempt in 1 2 3 4 5; do
            cosign sign --yes "hub.nspawn.org/${{ matrix.repo }}@$digest" && break
            [ "$attempt" = 5 ] && exit 1
            echo "signing failed (attempt $attempt of 5); retrying in 30 seconds"
            sleep 30
          done
          docker logout hub.nspawn.org

      # What anyone can run against a pulled image (see the README); here it proves the
      # signature landed and names the identity that verifies it.
      - name: Verify the signature
        if: github.event_name != 'pull_request'
        run: |
          cosign verify \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/mkosi.yml@${{ github.ref }}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "hub.nspawn.org/${{ matrix.repo }}@$DIGEST" > /dev/null
