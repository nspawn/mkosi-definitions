# Rust on the Debian image: mkosi -d debian --profile=rust
[Output]
ImageId=rust
Output=%i_%v_%a
OciAnnotations=org.opencontainers.image.title="Rust"
               org.opencontainers.image.description="Rust on Debian as a systemd-nspawn machine: the current stable toolchain installed with rustup under /usr/local (Debian ships 1.85), rustup update included, for a development machine you keep (-v ~/src:/root/src). Built with mkosi from nspawn/mkosi-definitions."
OciLabels=org.opencontainers.image.title="Rust"
          org.opencontainers.image.description="Rust on Debian as a systemd-nspawn machine: the current stable toolchain installed with rustup under /usr/local (Debian ships 1.85), rustup update included, for a development machine you keep (-v ~/src:/root/src). Built with mkosi from nspawn/mkosi-definitions."

# rustup, not Debian's rustc, so that the toolchain is the current stable one and can be
# updated inside the machine. mkosi.prepare does the install; RUSTUP_HOME and CARGO_HOME
# are under /usr/local, as in Rust's own container image.
[Content]
Packages=
        build-essential
        ca-certificates
        curl
        git
        pkgconf
        vim
