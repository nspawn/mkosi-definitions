# Go on the Debian image: mkosi -d debian --profile=golang
[Output]
ImageId=golang
Output=%i_%v_%a
OciAnnotations=org.opencontainers.image.title="Go"
               org.opencontainers.image.description="Go on Debian as a systemd-nspawn machine: the current release from go.dev in /usr/local/go, on the PATH for every shell, for a development machine you keep (-v ~/src:/root/src). Built with mkosi from nspawn/mkosi-definitions."
OciLabels=org.opencontainers.image.title="Go"
          org.opencontainers.image.description="Go on Debian as a systemd-nspawn machine: the current release from go.dev in /usr/local/go, on the PATH for every shell, for a development machine you keep (-v ~/src:/root/src). Built with mkosi from nspawn/mkosi-definitions."

# Debian's golang lags a release or two, so mkosi.prepare (the script mkosi runs with
# network access) takes the current one from go.dev and checks it against the sha256 the
# same API publishes.
[Content]
Packages=
        build-essential
        ca-certificates
        curl
        git
        vim
