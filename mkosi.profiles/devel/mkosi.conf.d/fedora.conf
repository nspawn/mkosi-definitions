[Match]
Distribution=fedora

[Output]
ImageId=fedora-devel
Output=%i_%v_%a
OciAnnotations=org.opencontainers.image.title="Fedora %r toolbox"
               org.opencontainers.image.description="Fedora %r as a machine to work in: compilers, git and the usual tools, with a home to mount from the host (-v ~/src:/root/src). Built with mkosi from nspawn/mkosi-definitions."
OciLabels=org.opencontainers.image.title="Fedora %r toolbox"
          org.opencontainers.image.description="Fedora %r as a machine to work in: compilers, git and the usual tools, with a home to mount from the host (-v ~/src:/root/src). Built with mkosi from nspawn/mkosi-definitions."

[Content]
Packages=
        cmake
        curl
        file
        findutils
        gcc
        gcc-c++
        gdb
        git-core
        htop
        jq
        less
        make
        man-db
        openssh-clients
        pkgconf
        procps-ng
        python3
        rsync
        strace
        tar
        tmux
        unzip
        vim
        wget
        which
