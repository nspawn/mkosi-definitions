[Match]
Distribution=arch

[Output]
ImageId=archlinux-devel
Output=%i_%v_%a
OciAnnotations=org.opencontainers.image.title="Arch Linux toolbox"
               org.opencontainers.image.description="Arch Linux, rolling, as a machine to work in: compilers, git and the usual tools, with a home to mount from the host (-v ~/src:/root/src). Built with mkosi from nspawn/mkosi-definitions."
OciLabels=org.opencontainers.image.title="Arch Linux toolbox"
          org.opencontainers.image.description="Arch Linux, rolling, as a machine to work in: compilers, git and the usual tools, with a home to mount from the host (-v ~/src:/root/src). Built with mkosi from nspawn/mkosi-definitions."

[Content]
Packages=
        base-devel
        cmake
        curl
        file
        gdb
        git
        htop
        jq
        less
        man-db
        openssh
        python
        rsync
        strace
        tmux
        unzip
        vim
        wget
        which
