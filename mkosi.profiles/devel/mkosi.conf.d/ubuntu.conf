[Match]
Distribution=ubuntu

[Output]
ImageId=ubuntu-devel
Output=%i_%v_%a
OciAnnotations=org.opencontainers.image.title="Ubuntu %r toolbox"
               org.opencontainers.image.description="Ubuntu %r as a machine to work in: compilers, git and the usual tools, with a home to mount from the host (-v ~/src:/root/src). Built with mkosi from nspawn/mkosi-definitions."
OciLabels=org.opencontainers.image.title="Ubuntu %r toolbox"
          org.opencontainers.image.description="Ubuntu %r as a machine to work in: compilers, git and the usual tools, with a home to mount from the host (-v ~/src:/root/src). Built with mkosi from nspawn/mkosi-definitions."

[Content]
Packages=
        build-essential
        ca-certificates
        cmake
        curl
        file
        gdb
        git
        htop
        jq
        less
        man-db
        openssh-client
        pkgconf
        procps
        python3
        rsync
        strace
        tmux
        unzip
        vim
        wget
