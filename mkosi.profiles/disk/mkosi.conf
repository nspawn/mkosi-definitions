# A bootable disk image of the same content, for a VM instead of a container:
#
#   mkosi --profile=disk -d fedora -r 44 && mkosi --profile=disk -d fedora -r 44 vm
#
# Partitions come from mkosi.repart/; the kernel packages from mkosi.conf.d/ here.
[Output]
Format=disk
CompressOutput=no

[Content]
Bootable=yes
Initrds=default
