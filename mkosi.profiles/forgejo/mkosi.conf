# Forgejo on the Debian image: mkosi -d debian --profile=forgejo
[Output]
ImageId=forgejo
Output=%i_%v_%a
OciAnnotations=org.opencontainers.image.title="Forgejo"
               org.opencontainers.image.description="Forgejo on Debian %r as a systemd-nspawn machine: the current release binary from Codeberg, verified with Forgejo's release key, running as the git user on port 3000 with SQLite unless the installer at / is told otherwise. Data in /var/lib/forgejo, configuration in /etc/forgejo/app.ini. Built with mkosi from nspawn/mkosi-definitions."
OciLabels=org.opencontainers.image.title="Forgejo"
          org.opencontainers.image.description="Forgejo on Debian %r as a systemd-nspawn machine: the current release binary from Codeberg, verified with Forgejo's release key, running as the git user on port 3000 with SQLite unless the installer at / is told otherwise. Data in /var/lib/forgejo, configuration in /etc/forgejo/app.ini. Built with mkosi from nspawn/mkosi-definitions."

# Forgejo is not packaged by Debian. mkosi.prepare (the script mkosi runs with network
# access) downloads the current
# release from Codeberg and checks its signature against forgejo.gpg (Forgejo Releases
# <release@forgejo.org>, EB114F5E6C0DC2BCDD183550A4B61A2DC5923710); the key stays in the
# image for the next upgrade by hand. The version is written to /usr/share/forgejo/VERSION for
# the hub's tags.
[Content]
ExtraTrees=forgejo.gpg:/usr/share/keyrings/forgejo-release.gpg

[Content]
Packages=
        git
        git-lfs
