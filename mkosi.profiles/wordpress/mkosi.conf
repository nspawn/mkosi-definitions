# WordPress on the Debian image: mkosi -d debian --profile=wordpress
[Output]
ImageId=wordpress
Output=%i_%v_%a
OciAnnotations=org.opencontainers.image.title="WordPress"
               org.opencontainers.image.description="WordPress on Debian %r as a systemd-nspawn machine: Debian's wordpress package with nginx, PHP-FPM and MariaDB in one machine. The database and its user are created on the first boot; open port 80 and finish the installation in the browser. Content in /var/lib/wordpress, database in /var/lib/mysql, configuration in /etc/wordpress and /etc/nginx. Built with mkosi from nspawn/mkosi-definitions."
OciLabels=org.opencontainers.image.title="WordPress"
          org.opencontainers.image.description="WordPress on Debian %r as a systemd-nspawn machine: Debian's wordpress package with nginx, PHP-FPM and MariaDB in one machine. The database and its user are created on the first boot; open port 80 and finish the installation in the browser. Content in /var/lib/wordpress, database in /var/lib/mysql, configuration in /etc/wordpress and /etc/nginx. Built with mkosi from nspawn/mkosi-definitions."

[Content]
Packages=
        wordpress
        nginx
        php-fpm
        php-mysql
        php-gd
        php-xml
        php-mbstring
        php-curl
        php-zip
        php-intl
        mariadb-server
