# Grafana on the Debian image: mkosi -d debian --profile=grafana
[Output]
ImageId=grafana
Output=%i_%v_%a
OciAnnotations=org.opencontainers.image.title="Grafana"
               org.opencontainers.image.description="Grafana on Debian %r as a systemd-nspawn machine: the package from Grafana Labs' repository (kept in the image for apt upgrade), enabled as a service on port 3000 on every address, admin/admin until changed, data in /var/lib/grafana and configuration in /etc/grafana. Built with mkosi from nspawn/mkosi-definitions."
OciLabels=org.opencontainers.image.title="Grafana"
          org.opencontainers.image.description="Grafana on Debian %r as a systemd-nspawn machine: the package from Grafana Labs' repository (kept in the image for apt upgrade), enabled as a service on port 3000 on every address, admin/admin until changed, data in /var/lib/grafana and configuration in /etc/grafana. Built with mkosi from nspawn/mkosi-definitions."

# Grafana is not in Debian. Its repository and signing key (Grafana Labs
# <engineering@grafana.com>, https://apt.grafana.com/gpg.key) go into the sandbox where apt
# runs during the build, and into the image itself so that apt upgrade keeps working.
[Build]
SandboxTrees=grafana.gpg:/usr/share/keyrings/grafana.gpg
             grafana.sources:/etc/apt/sources.list.d/grafana.sources

[Content]
ExtraTrees=grafana.gpg:/usr/share/keyrings/grafana.gpg
           grafana.sources:/etc/apt/sources.list.d/grafana.sources

[Content]
Packages=
        grafana
