# Node.js on the Debian image: mkosi -d debian --profile=nodejs
[Output]
ImageId=nodejs
Output=%i_%v_%a
OciAnnotations=org.opencontainers.image.title="Node.js"
               org.opencontainers.image.description="Node.js %r on Debian as a systemd-nspawn machine: the current release line from NodeSource (Debian ships 20), with npm, for a development machine you keep (-v ~/src:/root/src). Built with mkosi from nspawn/mkosi-definitions."
OciLabels=org.opencontainers.image.title="Node.js"
          org.opencontainers.image.description="Node.js %r on Debian as a systemd-nspawn machine: the current release line from NodeSource (Debian ships 20), with npm, for a development machine you keep (-v ~/src:/root/src). Built with mkosi from nspawn/mkosi-definitions."

# Debian's nodejs is 20; this takes 24 from NodeSource. Its repository and key go into the
# sandbox where apt runs during the build and into the image, so that apt upgrade keeps
# working inside. Key: NSolid <nsolid-gpg@nodesource.com>, deb.nodesource.com.
[Build]
SandboxTrees=nodesource.gpg:/usr/share/keyrings/nodesource.gpg
             nodesource.sources:/etc/apt/sources.list.d/nodesource.sources

[Content]
ExtraTrees=nodesource.gpg:/usr/share/keyrings/nodesource.gpg
           nodesource.sources:/etc/apt/sources.list.d/nodesource.sources
Packages=
        build-essential
        ca-certificates
        curl
        git
        nodejs
        vim
