[Match]
Distribution=ubuntu

[Output]
OciAnnotations=org.opencontainers.image.title="Ubuntu %r"
               org.opencontainers.image.description="Ubuntu %r as a systemd-nspawn machine. Minimal, with systemd-networkd and systemd-resolved for the nspawn bridge. Built with mkosi from nspawn/mkosi-definitions."
OciLabels=org.opencontainers.image.title="Ubuntu %r"
          org.opencontainers.image.description="Ubuntu %r as a systemd-nspawn machine. Minimal, with systemd-networkd and systemd-resolved for the nspawn bridge. Built with mkosi from nspawn/mkosi-definitions."

[Distribution]
Release=noble
Repositories=main,universe,restricted,multiverse

[Content]
# nspawn shell reaches a booted machine through its D-Bus, and on jammy nothing else in
# this list pulls dbus in.
Packages=
        apt
        dbus
        gnupg2
        iproute2
        iputils-ping
        systemd
        tzdata
        vim
