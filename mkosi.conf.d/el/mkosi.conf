[Match]
Distribution=|centos
Distribution=|alma
Distribution=|rocky

[Distribution]
Release=10
# systemd-networkd, which configures the machine's interface on the nspawn bridge, lives
# in EPEL on Enterprise Linux.
Repositories=epel

[Content]
# epel-release puts EPEL into the image as well, so that dnf inside the machine can update
# systemd-networkd, which came from there.
Packages=
        dnf
        epel-release
        iproute
        iputils
        systemd-networkd
        systemd-resolved
        vim
