[Match]
Distribution=|centos
Distribution=|alma
Distribution=|rocky

[Distribution]
Release=10
# systemd-networkd, which configures the machine's interface on the nspawn bridge, lives
# in EPEL on Enterprise Linux.
Repositories=epel

[Content]
# epel-release puts EPEL into the image as well, so that dnf inside the machine can update
# systemd-networkd, which came from there. A shell needs pam, with the stacks in /etc/pam.d,
# and util-linux, whose /etc/pam.d/login is the stack machined opens it with; systemd-pam's
# pam_systemd gives it a logind session. Enterprise Linux 10 pulls in only pam-libs and
# util-linux-core, so without them no shell opens at all.
Packages=
        dnf
        epel-release
        iproute
        iputils
        pam
        systemd-networkd
        systemd-pam
        systemd-resolved
        util-linux
        vim
