[Match]
Distribution=debian

[Output]
OciAnnotations=org.opencontainers.image.title="Debian %r"
               org.opencontainers.image.description="Debian %r as a systemd-nspawn machine. Minimal, with systemd-networkd and systemd-resolved for the nspawn bridge. Built with mkosi from nspawn/mkosi-definitions."
OciLabels=org.opencontainers.image.title="Debian %r"
          org.opencontainers.image.description="Debian %r as a systemd-nspawn machine. Minimal, with systemd-networkd and systemd-resolved for the nspawn bridge. Built with mkosi from nspawn/mkosi-definitions."

[Distribution]
Release=trixie

[Content]
# systemd 262 (in sid) only recommends mount, and mkosi installs no recommends: without it
# every mount unit fails, dev-hugepages.mount at boot among them. passwd (passwd, useradd)
# has to be asked for as well: trixie and bookworm get it through other packages, sid does
# not, which leaves no way to change root's password or to add a user.
Packages=
        apt
        gnupg2
        iproute2
        iputils-ping
        mount
        passwd
        systemd
        systemd-resolved
        tzdata
        vim
