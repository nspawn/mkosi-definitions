[Match]
Distribution=arch

[Output]
ImageId=archlinux
OciAnnotations=org.opencontainers.image.title="Arch Linux"
               org.opencontainers.image.description="Arch Linux, rolling, as a systemd-nspawn machine. Minimal, with systemd-networkd and systemd-resolved for the nspawn bridge. Built with mkosi from nspawn/mkosi-definitions."
OciLabels=org.opencontainers.image.title="Arch Linux"
          org.opencontainers.image.description="Arch Linux, rolling, as a systemd-nspawn machine. Minimal, with systemd-networkd and systemd-resolved for the nspawn bridge. Built with mkosi from nspawn/mkosi-definitions."

[Distribution]
Release=rolling


[Content]
Packages=
        base
        cryptsetup
        dbus
        gnutls
        libbpf
        libfido2
        libmicrohttpd
        libnftnl
        libpwquality
        libseccomp
        libxkbcommon
        openssl
        qrencode
        tpm2-tss
        vim
