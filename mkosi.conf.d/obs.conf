# Settings that only apply when building inside an Open Build Service build
# root (https://build.opensuse.org/project/show/system:systemd:nspawn).
#
# OBS serves the distribution packages from a local mirror at /.build.binaries
# and passes --output-dir and --image-version on the command line. The
# distribution and release are not set here on purpose: mkosi takes them from
# the build root, so the same tree builds every *_images repository.
[Match]
PathExists=/.build.binaries

[Output]
Format=tar
CompressOutput=xz
ImageId=%d-%r
Output=%i_%v_%a
ManifestFormat=json

[Validation]
Checksum=yes
Sign=no

[Content]
SELinuxRelabel=no
