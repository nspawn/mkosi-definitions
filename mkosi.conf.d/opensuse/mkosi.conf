[Match]
Distribution=opensuse

[Output]
OciAnnotations=org.opencontainers.image.title="openSUSE %r"
               org.opencontainers.image.description="openSUSE %r as a systemd-nspawn machine. Minimal, with systemd-networkd and systemd-resolved for the nspawn bridge. Built with mkosi from nspawn/mkosi-definitions."
OciLabels=org.opencontainers.image.title="openSUSE %r"
          org.opencontainers.image.description="openSUSE %r as a systemd-nspawn machine. Minimal, with systemd-networkd and systemd-resolved for the nspawn bridge. Built with mkosi from nspawn/mkosi-definitions."

[Distribution]
Release=tumbleweed

[Content]
# Nothing in the minimal set pulls in the CA certificates, and without them every https
# download inside the machine fails, zypper's included. The repositories come from the
# openSUSE-repos package of the release, in mkosi.conf.d/.
Packages=
        ca-certificates-mozilla
        iproute2
        iputils
        systemd
        systemd-network
        vim
        zypper
