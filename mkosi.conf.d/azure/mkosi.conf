# Azure Linux 4.0 is a beta: Microsoft publishes it only under 4.0/beta/, while mkosi builds
# the 4.0/prod/ URLs that 3.0 uses, which do not exist for 4.0. So the build reads the beta
# base repository directly (x86-64, the only architecture the hub builds), and the image's
# own repository files come from azurelinux-repos. When 4.0 leaves beta, LocalMirror= goes,
# and images.json tags it 4.0 and latest in place of 4.0-beta.
[Match]
Distribution=azure

[Output]
ImageId=azurelinux
Output=%i_%v_%a
OciAnnotations=org.opencontainers.image.title="Azure Linux %r (beta)"
               org.opencontainers.image.description="Azure Linux %r, Microsoft's Fedora-based distribution, as a systemd-nspawn machine. A beta, installing packages from Microsoft's beta repositories. Minimal, with systemd-networkd and systemd-resolved for the nspawn bridge. Built with mkosi from nspawn/mkosi-definitions."
OciLabels=org.opencontainers.image.title="Azure Linux %r (beta)"
          org.opencontainers.image.description="Azure Linux %r, Microsoft's Fedora-based distribution, as a systemd-nspawn machine. A beta, installing packages from Microsoft's beta repositories. Minimal, with systemd-networkd and systemd-resolved for the nspawn bridge. Built with mkosi from nspawn/mkosi-definitions."

[Distribution]
Release=4.0
LocalMirror=https://packages.microsoft.com/azurelinux/4.0/beta/base/x86_64/

[Content]
# What the Fedora image has, in Azure Linux's packages: dnf5 is its dnf, and shadow-utils
# carries passwd as well as useradd. azurelinux-repos-dev also satisfies the release
# package, but points dnf at an unsigned development feed; naming azurelinux-repos keeps
# the signed repositories.
Packages=
        azurelinux-repos
        dbus-broker
        dnf5
        glibc-langpack-en
        iproute
        iputils
        pam
        shadow-utils
        systemd-networkd
        systemd-pam
        systemd-resolved
        tzdata
        util-linux
        vim-minimal
