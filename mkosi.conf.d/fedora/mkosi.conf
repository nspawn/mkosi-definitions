[Match]
Distribution=fedora

[Output]
OciAnnotations=org.opencontainers.image.title="Fedora %r"
               org.opencontainers.image.description="Fedora %r as a systemd-nspawn machine. Minimal, with systemd-networkd and systemd-resolved for the nspawn bridge. Built with mkosi from nspawn/mkosi-definitions."
OciLabels=org.opencontainers.image.title="Fedora %r"
          org.opencontainers.image.description="Fedora %r as a systemd-nspawn machine. Minimal, with systemd-networkd and systemd-resolved for the nspawn bridge. Built with mkosi from nspawn/mkosi-definitions."

[Distribution]
Release=44

[Content]
# systemd-pam carries pam_systemd, which Fedora's PAM stack calls when it is there: it gives
# a shell, nspawn shell's among them, a logind session with the user's own systemd, whose
# dbus-broker is the session bus.
Packages=
        dbus-broker
        dnf
        fedora-release
        glibc-langpack-en
        iproute
        iputils
        pam
        passwd
        sssd
        systemd-networkd
        systemd-pam
        systemd-resolved
        util-linux
        vim
