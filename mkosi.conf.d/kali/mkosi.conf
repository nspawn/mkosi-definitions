# The Fedora tools tree has the Debian and Ubuntu archive keyrings but not Kali's, and
# mkosi refuses to write apt sources for a keyring the tools tree lacks. So mkosi.sandbox/
# here, laid over the sandbox where apt runs (never into the image), carries both the
# sources file and the keyring published at https://archive.kali.org/archive-keyring.gpg
# (devel@kali.org, the 2012 repository key and the 2025 automatic signing key).
[Match]
Distribution=kali

[Distribution]
Release=kali-rolling

[Content]
# A minimal Kali, like the official container image: apt and the base system, the tools
# are one `apt install kali-linux-headless` away.
Packages=
        apt
        gnupg2
        iproute2
        iputils-ping
        systemd
        systemd-resolved
        vim
