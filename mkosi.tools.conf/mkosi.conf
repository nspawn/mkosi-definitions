# Extra configuration of the default tools tree (ToolsTree=default in mkosi.conf).
#
# Fedora packages the Debian and Ubuntu archive keyrings but not Kali's, so the tools
# tree gets it from mkosi.extra/: /usr/share/keyrings/kali-archive-keyring.gpg, the
# keyring published at https://archive.kali.org/archive-keyring.gpg (keys of
# devel@kali.org: the 2012 repository key and the 2025 automatic signing key).
